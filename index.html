<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>读书札记</title>
<meta name="description" content="读完的书，一本一行：书名、作者、主角、评分和读后感。">
<meta name="theme-color" content="#FBF6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="读书札记">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: a hero title that scrolls away, then one sticky dock (search, sort, tag filter) over a ledger of books.
   Phone: two-line rows that unfold in place. Desktop (820px+): the same rows laid out as table columns. */
:root {
  --bg: #FBF6F4; --surface: #FFFFFF; --ink: #33232B; --muted: #76606B; --line: #EEDDE1;
  --rose: #B8436B; --rose-ink: #FFFFFF; --blush: #FBE7ED; --star: #D9708C; --danger: #AE3A33; --ok: #3C8A62;
  --scrim: rgba(40, 18, 28, .42);
  --shadow: 0 12px 34px rgba(120, 60, 85, .16), 0 2px 6px rgba(120, 60, 85, .08);
  --f-display: "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --z-sticky: 10; --z-fab: 20; --z-pop: 30; --z-sheet: 40; --z-toast: 50;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --cols: 40px minmax(200px, 1.7fr) minmax(90px, .8fr) minmax(110px, 1fr) 84px minmax(180px, 2fr);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1D1619; --surface: #281E23; --ink: #F3E6EA; --muted: #BBA5AF; --line: #3B2C33;
    --rose: #EE8FAE; --rose-ink: #2A1219; --blush: #3A2530; --star: #F0A0B6; --danger: #F08A80; --ok: #7FCFA4;
    --scrim: rgba(0, 0, 0, .58);
    --shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
* { -webkit-tap-highlight-color: transparent; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
html.locked { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); padding-top: var(--safe-t); min-height: 100dvh; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px calc(120px + var(--safe-b)); }

/* hero: big title, scrolls away */
.hero { padding: 22px 0 10px; transform-origin: left bottom; }
h1 { font: 400 34px/1.2 var(--f-display); letter-spacing: .06em; margin: 0; }
.stats { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) {
  .hero { opacity: calc(1 - var(--p, 0)); transform: translateY(calc(var(--p, 0) * -8px)) scale(calc(1 - var(--p, 0) * .04)); }
}

/* dock: sticky search + sort + tags */
.dock-sentinel { height: 1px; margin-bottom: -1px; }
.dock { position: sticky; top: var(--safe-t); z-index: var(--z-sticky); margin-inline: -16px; padding: 8px 16px 10px; display: grid; gap: 10px; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .25s, box-shadow .25s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--safe-t); background: var(--bg); z-index: var(--z-sticky); } /* keeps the notch strip opaque so rows never show above the stuck dock */
.dock.stuck { border-bottom-color: var(--line); box-shadow: 0 8px 20px -18px rgba(90, 40, 60, .55); }
.dock-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.search { position: relative; flex: 1; min-width: 0; }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 42px; padding: 0 40px 0 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; transition: border-color .2s, box-shadow .2s; appearance: none; -webkit-appearance: none; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rose) 18%, transparent); }
.q-clear { position: absolute; right: 5px; top: 50%; translate: 0 -50%; width: 32px; height: 32px; border: none; background: none; border-radius: 50%; color: var(--muted); display: grid; place-items: center; opacity: 0; scale: .6; pointer-events: none; transition: opacity .18s, scale .18s var(--ease); }
.q-clear.on { opacity: 1; scale: 1; pointer-events: auto; }
.q-clear svg { position: static; translate: none; width: 16px; height: 16px; }
.icon-btn { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; position: relative; transition: transform .16s var(--ease), background-color .2s; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:active, .btn:active, .chip:active, .sortgrp button:active { transform: scale(.94); }
.sync .dot { position: absolute; right: 8px; bottom: 9px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--surface); background: var(--muted); transition: background-color .3s; }
.sync[data-state="ok"] .dot { background: var(--ok); }
.sync[data-state="err"] .dot { background: var(--danger); }
.sync[data-state="busy"] .dot { background: var(--rose); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .45; } }

.sortgrp { flex: none; display: flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.sortgrp button { border: none; background: none; height: 34px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; transition: transform .16s var(--ease); }
#btn-sort { padding: 0 6px 0 13px; border-radius: 999px 0 0 999px; }
#btn-dir { padding: 0 11px 0 6px; border-radius: 0 999px 999px 0; color: var(--rose); }
#btn-sort svg { width: 12px; height: 12px; color: var(--muted); }
#btn-dir svg { width: 16px; height: 16px; transition: rotate .32s var(--ease); }
#btn-dir.asc svg { rotate: 180deg; }
.chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px 2px 2px; margin-right: -16px; mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 30px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 0 12px; font-size: 13px; white-space: nowrap; transition: background-color .22s, color .22s, border-color .22s, transform .16s var(--ease); }
.chip i { font-style: normal; opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); font-weight: 600; }

/* buttons */
.btn { border-radius: 999px; padding: 0 18px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; transition: transform .16s var(--ease), background-color .2s, opacity .2s; white-space: nowrap; }
.btn.primary { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); font-weight: 600; }
.btn.text { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 12px; }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 36px; font-size: 14px; padding-inline: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.desk { display: none; }

/* ledger */
.thead { display: none; }
.group { display: flex; gap: 8px; align-items: baseline; padding: 18px 4px 4px; font-size: 12px; color: var(--muted); }
.group b { color: var(--rose); font-size: 15px; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 12px 8px; border-bottom: 1px solid var(--line); border-radius: 0; cursor: pointer; transition: background-color .3s, border-color .3s, border-radius .3s; }
.row.open { background: var(--blush); border-bottom-color: transparent; border-radius: 14px; }
.c-no, .c-author, .c-cast { display: none; }
.c-title { all: unset; cursor: pointer; grid-column: 1; font-weight: 600; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; min-width: 0; padding-left: 1em; text-indent: -1em; margin-left: -.5em; text-wrap: balance; line-break: strict; }
.c-title:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 6px; }
.c-rate { grid-column: 2; grid-row: 1; align-self: center; }
.c-meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-meta .sep { margin-inline: 6px; opacity: .5; }
.c-meta .who { color: var(--ink); }
.c-th { grid-column: 1 / -1; font-size: 14px; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; line-clamp: 1; opacity: .86; overflow-wrap: anywhere; }
.c-th:empty { display: none; }
.row.open .c-meta { white-space: normal; }
.row.open .c-th { display: block; white-space: pre-wrap; opacity: 1; line-height: 1.75; padding-top: 6px; max-width: 70ch; -webkit-user-select: text; user-select: text; cursor: text; }
.row.open .c-th:empty { display: block; }
.row.open .c-th:empty::before { content: "还没写感受"; color: var(--muted); }
.extra { grid-column: 1 / -1; display: none; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 10px; }
.row.open .extra { display: flex; }
.extra .tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--surface); color: var(--rose); border: none; white-space: nowrap; line-height: 20px; }
.extra .acts { display: flex; gap: 6px; margin-left: auto; }
.stars { color: var(--star); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }
@media (prefers-reduced-motion: no-preference) {
  .row.open .extra, .row.open .c-th { animation: rise .34s var(--ease) both; }
  .row.closing .extra, .row.closing .c-th { animation: none; opacity: 0; transition: opacity .14s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
}

.empty { padding: 56px 8px; text-align: center; color: var(--muted); }
.empty h2 { font: 400 22px/1.3 var(--f-display); color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 auto; max-width: 30em; }
.empty .btns { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.skel { height: 58px; border-bottom: 1px solid var(--line); display: grid; align-content: center; gap: 8px; padding-inline: 8px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 45%, var(--bg)) 50%, var(--line) 75%) 0 0 / 200% 100%; animation: shimmer 1.3s linear infinite; }
.skel i:first-child { width: 46%; } .skel i:last-child { width: 72%; height: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* floating add button */
.fab { position: fixed; right: 18px; bottom: calc(18px + var(--safe-b)); width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--rose); color: var(--rose-ink); box-shadow: var(--shadow); display: grid; place-items: center; z-index: var(--z-fab); transition: transform .38s var(--ease), opacity .25s; }
.fab svg { width: 26px; height: 26px; transition: rotate .38s var(--ease); }
.fab:active { transform: scale(.9); }
.fab.away { transform: translateY(90px) scale(.8); opacity: 0; pointer-events: none; }

/* sort popover */
.pop { position: fixed; z-index: var(--z-pop); min-width: 190px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transform-origin: 20px 0; opacity: 0; transform: scale(.86); pointer-events: none; transition: opacity .16s, transform .2s var(--ease); }
.pop.in { opacity: 1; transform: none; pointer-events: auto; transition: opacity .2s, transform .3s var(--ease); }
.pop button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; border: none; background: none; padding: 10px 12px; border-radius: 10px; font-size: 15px; text-align: left; transition: background-color .15s; }
.pop button:hover, .pop button:focus-visible { background: var(--blush); }
.pop button svg { width: 16px; height: 16px; color: var(--rose); opacity: 0; scale: .5; transition: opacity .18s, scale .25s var(--ease); }
.pop button.on { font-weight: 600; }
.pop button.on svg { opacity: 1; scale: 1; }
.pop small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

/* sheets */
.ov { position: fixed; inset: 0; z-index: var(--z-sheet); display: flex; align-items: flex-end; justify-content: center; padding-bottom: var(--kb, 0px); background: transparent; transition: background-color .28s; }
.ov.in { background: var(--scrim); }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: calc(100dvh - var(--kb, 0px) - var(--safe-t) - 18px); display: flex; flex-direction: column; border-radius: 24px 24px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .28s cubic-bezier(.4, 0, 1, 1); will-change: transform; }
.ov.in .sheet { transform: none; transition: transform .46s var(--ease-sheet); }
.sheet.dragging { transition: none !important; }
.sheet-head { flex: none; padding: 8px 20px 4px; touch-action: none; cursor: grab; }
.grip { width: 38px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 10px; }
.sheet-head h2 { font: 400 23px/1.3 var(--f-display); margin: 0; overflow-wrap: anywhere; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 20px 4px; display: grid; gap: 14px; align-content: start; }
.sheet-foot { flex: none; display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 10px 20px calc(14px + var(--safe-b)); border-top: 1px solid transparent; }
.ov[style*="--kb"] .sheet-foot { padding-bottom: 12px; }
.sheet-foot .note { margin-right: auto; font-size: 13px; color: var(--danger); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 10px; }
.fields .full { grid-column: 1 / -1; }
.f { display: grid; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
.f input, .f textarea, .area { width: 100%; min-width: 0; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; transition: border-color .2s, box-shadow .2s, background-color .2s; appearance: none; -webkit-appearance: none; }
.f input { height: 46px; }
.f input[type="date"] { display: block; text-align: left; }
.f textarea, .area { resize: vertical; line-height: 1.7; min-height: 120px; display: block; }
.f input:focus, .f textarea:focus, .area:focus { outline: none; border-color: var(--rose); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rose) 18%, transparent); }
.f .err { color: var(--danger); min-height: 0; }
.f .err:empty { display: none; }
.f.bad input { border-color: var(--danger); }
.stars-in { display: flex; align-items: center; }
.stars-in .s { border: none; background: none; width: 44px; height: 44px; font-size: 27px; line-height: 1; color: var(--line); padding: 0; transition: color .2s, transform .28s var(--ease); transition-delay: calc(var(--i) * 28ms); }
.stars-in .s.on { color: var(--star); transform: scale(1.12); }
.stars-in .s:active { transform: scale(.85); transition-delay: 0s; }
.menu { display: grid; }
.menu button { text-align: left; border: none; background: none; padding: 13px 4px; border-bottom: 1px solid var(--line); font-size: 16px; display: grid; gap: 1px; transition: background-color .15s; }
.menu button:last-child { border-bottom: none; }
.menu button:active { background: var(--blush); }
.menu button span { font-size: 12.5px; color: var(--muted); }
.preview { display: grid; gap: 6px; }
.pv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
.pv input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--rose); }
.pv .t { font-weight: 600; overflow-wrap: anywhere; }
.pv .m, .pv .x { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {
  .pv { animation: rise .32s var(--ease) both; animation-delay: calc(min(var(--i, 0), 10) * 30ms); }
  .shake { animation: shake .36s var(--ease); }
  @keyframes shake { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
}

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-b) + var(--kb, 0px)); z-index: var(--z-toast); max-width: min(92vw, 460px); display: flex; align-items: center; gap: 10px; padding: 11px 12px 11px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow); opacity: 0; transform: translate(-50%, 24px) scale(.94); pointer-events: none; transition: opacity .2s, transform .22s cubic-bezier(.4, 0, 1, 1); }
.toast.in { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; transition: opacity .25s, transform .42s var(--ease); }
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
.toast.err { background: var(--danger); color: #fff; }
.toast button { flex: none; border: none; background: color-mix(in srgb, var(--bg) 16%, transparent); color: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 5px 14px; }

/* desktop: real columns */
@media (min-width: 820px) {
  .wrap { padding-inline: 32px; }
  .hero { padding-top: 34px; }
  h1 { font-size: 40px; }
  .dock { margin-inline: -32px; padding-inline: 32px; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); align-items: center; column-gap: 14px; }
  .dock-row.tools { grid-column: 2; grid-row: 1; }
  .dock-row.main { grid-column: 1; }
  .desk { display: inline-flex; align-items: center; }
  .fab { display: none; }
  .chips { margin-right: 0; padding-right: 28px; }
  .thead, .row { display: grid; grid-template-columns: var(--cols); gap: 0 16px; align-items: start; }
  .thead { position: sticky; top: calc(var(--safe-t) + var(--dock-h, 60px)); z-index: calc(var(--z-sticky) - 1); background: var(--bg); padding: 12px 8px 9px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .thead button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; transition: color .2s; }
  .thead button:hover { color: var(--ink); }
  .thead button:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 4px; }
  .thead button.on { color: var(--rose); font-weight: 700; }
  .thead button svg { width: 13px; height: 13px; opacity: 0; transition: opacity .2s, rotate .32s var(--ease); }
  .thead button.on svg { opacity: 1; }
  .thead button.on.asc svg { rotate: 180deg; }
  .group { padding-top: 20px; }
  .row { padding: 12px 8px; }
  .row:hover { background: color-mix(in srgb, var(--blush) 45%, transparent); }
  .row.open { background: var(--blush); border-radius: 12px; }
  .c-no { display: block; grid-column: 1; color: var(--muted); font-size: 13px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .c-title { grid-column: 2; font-size: 15px; }
  .c-author { display: block; grid-column: 3; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .c-cast { display: block; grid-column: 4; font-size: 14px; overflow-wrap: anywhere; }
  .c-rate { grid-column: 5; grid-row: 1; align-self: start; line-height: 21.75px; }
  .c-meta { display: none; }
  .c-th { grid-column: 6; grid-row: 1; -webkit-line-clamp: 2; line-clamp: 2; }
  .row.open .c-th { padding-top: 0; }
  .extra { grid-column: 2 / -1; }
  .ov { align-items: center; padding: 24px; }
  .sheet { border-radius: 22px; max-height: min(86dvh, 760px); transform: translateY(18px) scale(.96); opacity: 0; transition: transform .2s cubic-bezier(.4, 0, 1, 1), opacity .18s; }
  .ov.in .sheet { opacity: 1; transition: transform .4s var(--ease), opacity .22s; }

<script>
(() => {
  "use strict";
  const API = "https://reading-log.yuuteng.workers.dev";
  const LS_DATA = "rl-data-v1", LS_SORT = "rl-sort", LS_DIR = "rl-dir";
  const $ = (id) => document.getElementById(id);
  const RM = matchMedia("(prefers-reduced-motion: reduce)");
  const DESK = matchMedia("(min-width: 820px)");
  const EASE = "cubic-bezier(.22,1,.36,1)";
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

  // ---------- store: local first, merged with the cloud ----------
  const store = { books: {}, deleted: {} };
  try { const d = JSON.parse(lsGet(LS_DATA) || "null"); if (d && d.books) { store.books = d.books; store.deleted = d.deleted || {}; } } catch (e) {}
  let quotaWarned = false;
  function saveStore() {
    if (!lsSet(LS_DATA, JSON.stringify(store)) && !quotaWarned) { quotaWarned = true; toast("这台设备存不下了，请先导出备份。", { err: true }); }
  }
  // Per-book last-write-wins; a tombstone beats any version that is not newer than it. Same function runs in the Worker.
  function mergeInto(dst, src) {
    let ch = false; const sb = src.books || {}, sd = src.deleted || {};
    for (const id in sd) if (!(dst.deleted[id] >= sd[id])) { dst.deleted[id] = sd[id]; ch = true; }
    for (const id in sb) { const l = dst.books[id], r = sb[id]; if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { dst.books[id] = r; ch = true; } }
    for (const id in dst.deleted) { const b = dst.books[id]; if (!b) continue; if (dst.deleted[id] >= (b.updatedAt || 0)) { delete dst.books[id]; ch = true; } else delete dst.deleted[id]; }
    return ch;
  }
  const books = () => Object.keys(store.books).map(id => ({ id, ...store.books[id] }));

  const splitTags = (s) => String(s || "").split(/[,，、\s]+/).map(t => t.trim()).filter(Boolean).slice(0, 12);
  const clampRating = (r) => Math.max(0, Math.min(5, Math.round(Number(r) || 0)));
  function normDate(s) {
    const m = String(s || "").match(/(\d{4})\s*[.\-/年]\s*(\d{1,2})(?:\s*[.\-/月]\s*(\d{1,2}))?/);
    return m ? m[1] + "-" + m[2].padStart(2, "0") + "-" + (m[3] || "1").padStart(2, "0") : "";
  }
  function clean(b) {
    return {
      title: String(b.title || "").trim().slice(0, 200),
      author: String(b.author || "").trim().slice(0, 120),
      cast: (Array.isArray(b.cast) ? b.cast.map(String) : String(b.cast || "").split(/[\s,，、×/]+/)).map(x => x.trim()).filter(Boolean).slice(0, 8),
      finished: normDate(b.finished),
      rating: clampRating(b.rating),
      tags: Array.isArray(b.tags) ? b.tags.map(String).map(s => s.trim()).filter(Boolean).slice(0, 12) : splitTags(b.tags),
      thoughts: String(b.thoughts || "").trim().slice(0, 50000),
    };
  }

  // ---------- view state ----------
  const SORTS = [["date", "读完时间", "desc", "没记日期的排最后"], ["added", "录入时间", "desc", ""], ["rating", "评分", "desc", "没评分的排最后"], ["title", "书名", "asc", ""], ["author", "作者", "asc", "没填作者的排最后"]];
  const defDir = (k) => (SORTS.find(x => x[0] === k) || SORTS[0])[2];
  const state = { q: "", tag: "", sort: lsGet(LS_SORT) || "date", dir: "", open: null, editing: null, rating: 0, parsed: [], firstPaint: true };
  if (!SORTS.some(x => x[0] === state.sort)) state.sort = "date";
  state.dir = lsGet(LS_DIR); if (state.dir !== "asc" && state.dir !== "desc") state.dir = defDir(state.sort);

  function filtered() {
    const q = state.q.trim().toLowerCase();
    let list = books();
    if (state.tag) list = list.filter(b => (b.tags || []).includes(state.tag));
    if (q) list = list.filter(b => [b.title, b.author, (b.cast || []).join(" "), b.thoughts, (b.tags || []).join(" ")].join(" ").toLowerCase().includes(q));
    const sg = state.dir === "asc" ? 1 : -1;
    const zh = (a, b) => a.localeCompare(b, "zh-Hans-CN");
    const added = (a, b) => (a.createdAt || 0) - (b.createdAt || 0);
    const recent = (a, b) => (b.finished || "").localeCompare(a.finished || "") || added(b, a);
    const by = {
      date: (a, b) => (!a.finished - !b.finished) || sg * (a.finished || "").localeCompare(b.finished || "") || sg * added(a, b),
      added: (a, b) => sg * added(a, b),
      rating: (a, b) => (!a.rating - !b.rating) || sg * ((a.rating || 0) - (b.rating || 0)) || recent(a, b),
      title: (a, b) => sg * zh(a.title, b.title),
      author: (a, b) => (!a.author - !b.author) || sg * zh(a.author || "", b.author || "") || recent(a, b),
    };
    return list.sort(by[state.sort]);
  }
  function setSort(k) {
    if (state.sort === k) state.dir = state.dir === "asc" ? "desc" : "asc"; else { state.sort = k; state.dir = defDir(k); }
    lsSet(LS_SORT, state.sort); lsSet(LS_DIR, state.dir);
    render({ flip: true });
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg, opt = {}) {
    const t = $("toast"), act = $("toast-act");
    $("toast-msg").textContent = msg; t.classList.toggle("err", !!opt.err);
    act.hidden = !opt.action; if (opt.action) { act.textContent = opt.action.label; act.onclick = () => { hideToast(); opt.action.fn(); }; }
    t.classList.add("in"); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, opt.action ? 6500 : opt.err ? 5000 : 2800);
  }
  function hideToast() { $("toast").classList.remove("in"); }

  // ---------- header bits ----------
  let statsShown = false;
  function renderStats() {
    const all = books(), y = String(new Date().getFullYear());
    const items = [["共", all.length, "本"], ["作者", new Set(all.map(b => b.author).filter(Boolean)).size, "位"]];
    const thisYear = all.filter(b => (b.finished || "").startsWith(y)).length; if (thisYear) items.push(["今年读完", thisYear, "本"]);
    const loved = all.filter(b => b.rating >= 4).length; if (loved) items.push(["四星以上", loved, "本"]);
    const box = $("stats"); box.textContent = "";
    const countUp = !statsShown && all.length && !RM.matches; if (all.length) statsShown = true;
    for (const [k, n, unit] of items) {
      const sp = el("span", null, k + " "), b = el("b", null, String(n)); sp.append(b, " " + unit); box.append(sp);
      if (countUp && n > 3) { const t0 = performance.now(); const tick = (t) => { const p = Math.min(1, (t - t0) / 520), e = 1 - Math.pow(1 - p, 4); b.textContent = String(Math.round(n * e)); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
    }
  }
  const chipEls = new Map(); let chipSig = "";
  function renderChips() {
    const counts = new Map();
    for (const id in store.books) (store.books[id].tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1));
    if (state.tag && !counts.has(state.tag)) state.tag = "";
    const tags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hans-CN"));
    const sig = tags.map(t => t.join(":")).join("|");
    const box = $("chips");
    if (sig !== chipSig) {
      chipSig = sig; chipEls.clear(); box.textContent = "";
      const add = (key, label, n) => {
        const c = el("button", "chip", label); c.type = "button"; if (n) c.append(el("i", null, String(n)));
        c.onclick = () => { state.tag = key && state.tag === key ? "" : key; render({ flip: true }); c.scrollIntoView({ behavior: RM.matches ? "auto" : "smooth", inline: "center", block: "nearest" }); };
        chipEls.set(key, c); box.append(c);
      };
      if (tags.length) add("", "全部");
      tags.forEach(([t, n]) => add(t, t, n));
    }
    for (const [k, c] of chipEls) { const on = k === state.tag; c.classList.toggle("on", on); c.setAttribute("aria-pressed", on ? "true" : "false"); }
  }
  function renderSort() {
    $("sort-label").textContent = SORTS.find(x => x[0] === state.sort)[1];
    const asc = state.dir === "asc";
    $("btn-dir").classList.toggle("asc", asc);
    $("btn-dir").setAttribute("aria-label", asc ? "当前升序，点击改为降序" : "当前降序，点击改为升序");
    document.querySelectorAll("#thead button").forEach(b => { const on = b.dataset.sort === state.sort; b.classList.toggle("on", on); b.classList.toggle("asc", on && asc); });
    document.querySelectorAll("#sort-pop button").forEach(b => b.classList.toggle("on", b.dataset.sort === state.sort));
  }

  // ---------- rows ----------
  const rowEls = new Map();
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
  function starsEl(n) {
    const s = el("span", "stars"); s.setAttribute("role", "img"); s.setAttribute("aria-label", n + " 星");
    s.append("★".repeat(n), el("span", "off", "★".repeat(5 - n))); return s;
  }
  function fillRow(r, b) {
    r.textContent = "";
    const no = el("span", "c-no");
    const t = el("button", "c-title", "《" + b.title + "》"); t.type = "button";
    const author = el("div", "c-author", b.author || "—");
    const cast = el("div", "c-cast", (b.cast || []).join(" × ") || "—");
    const rate = el("div", "c-rate"); if (b.rating) rate.append(starsEl(b.rating));
    const meta = el("div", "c-meta"); const parts = [];
    if (b.author) parts.push(el("span", null, b.author));
    if (b.cast && b.cast.length) parts.push(el("span", "who", b.cast.join(" × ")));
    if (b.finished) parts.push(el("span", null, b.finished.replace(/-/g, ".")));
    parts.forEach((p, k) => { if (k) meta.append(el("span", "sep", "·")); meta.append(p); });
    if (!parts.length) meta.textContent = "未填作者";
    const th = el("div", "c-th", b.thoughts || "");
    const extra = el("div", "extra"); extra.inert = true;
    const tags = el("div", "tags"); (b.tags || []).forEach(x => { const c = el("button", "tag", x); c.type = "button"; c.onclick = () => { state.tag = x; window.scrollTo({ top: 0, behavior: RM.matches ? "auto" : "smooth" }); render({ flip: true }); }; tags.append(c); });
    if (b.finished && DESK.matches) tags.append(el("span", "hint", "读完 " + b.finished.replace(/-/g, ".")));
    const acts = el("div", "acts");
    const del = el("button", "btn text danger sm", "删除"); del.type = "button"; del.onclick = () => removeBook(b.id);
    const edit = el("button", "btn primary sm", "编辑"); edit.type = "button"; edit.onclick = () => openForm(b.id);
    acts.append(del, edit); extra.append(tags, acts);
    r.append(no, t, author, cast, rate, meta, th, extra);
  }
  function makeRow(id) {
    const r = el("div", "row"); r.dataset.id = id;
    r.addEventListener("click", (e) => {
      if (e.target.closest(".extra")) return;
      if (r.classList.contains("open") && String(getSelection()).trim() && r.contains(getSelection().anchorNode)) return; // let people select text in an open note
      toggleRow(id);
    });
    return r;
  }
  function applyOpen(r, open) {
    r.classList.toggle("open", open);
    const t = r.querySelector(".c-title"), x = r.querySelector(".extra");
    if (t) t.setAttribute("aria-expanded", open ? "true" : "false"); if (x) x.inert = !open;
  }
  function setOpen(r, open) {
    if (!r || r.classList.contains("open") === open) return;
    if (r._an) { r._an.cancel(); r._an = null; }
    if (RM.matches || !r.isConnected) return applyOpen(r, open);
    const from = r.offsetHeight; let to;
    if (open) { applyOpen(r, true); to = r.offsetHeight; }
    else { r.classList.remove("open"); to = r.offsetHeight; r.classList.add("open", "closing"); }
    r.style.overflow = "hidden";
    const an = r._an = r.animate([{ height: from + "px" }, { height: to + "px" }], { duration: open ? 380 : 260, easing: EASE });
    const done = () => { if (r._an !== an) return; r._an = null; r.style.overflow = ""; r.classList.remove("closing"); if (!open) applyOpen(r, false); };
    an.onfinish = done; an.oncancel = () => { r.style.overflow = ""; r.classList.remove("closing"); };
  }
  function toggleRow(id) {
    const prev = state.open; state.open = prev === id ? null : id;
    if (prev && prev !== id) setOpen(rowEls.get(prev), false);
    setOpen(rowEls.get(id), state.open === id);
  }

  function render(opt = {}) {
    renderStats(); renderChips(); renderSort();
    const box = $("rows"), all = Object.keys(store.books).length;
    $("thead").style.visibility = all ? "" : "hidden";

    try {
      const res = await fetch(API + "/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ books: store.books, deleted: store.deleted }) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const changed = mergeInto(store, await res.json());
      lastSync = Date.now(); const wasInitial = initialPull; initialPull = false;
      if (changed) saveStore(); if (changed || wasInitial) render({ flip: true });
      setSync("ok");
    } catch (e) {
      const wasInitial = initialPull; initialPull = false; if (wasInitial) render();
      setSync("err", navigator.onLine === false ? "现在离线，联网后会自动同步" : "连不上同步服务，稍后自动重试");
    } finally { syncing = false; if (again) { again = false; queueSync(0); } }
  }
  function drawSync() {
    const kv = $("sync-kv"); kv.textContent = ""; const st = $("btn-sync").dataset.state;
    const rows = [["状态", { busy: "正在同步…", ok: "已同步到云端", err: syncNote }[st]], ["本机记录", Object.keys(store.books).length + " 本"]];
    if (lastSync) rows.push(["上次同步", new Date(lastSync).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })]);
    rows.forEach(([k, v]) => kv.append(el("dt", null, k), el("dd", null, v)));
  }
  function openSync() { drawSync(); openSheet("ov-sync"); }
  $("sync-now").onclick = () => sync();
  if (/[#&]k=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search); // old setup links carried a passphrase; no longer used
  lsSet("rl-key", null);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastSync > 20000) queueSync(0); });
  window.addEventListener("online", () => queueSync(0));
  setInterval(() => { if (!document.hidden) queueSync(0); }, 120000);

  // ---------- wiring ----------
  $("q").addEventListener("input", (e) => { state.q = e.target.value; $("q-clear").classList.toggle("on", !!state.q); render({ flip: true }); });
  $("q-clear").onclick = () => { state.q = ""; $("q").value = ""; $("q-clear").classList.remove("on"); render({ flip: true }); $("q").focus(); };
  $("fab").onclick = () => openForm(null);
  $("btn-add-d").onclick = () => openForm(null);
  $("btn-more").onclick = () => openSheet("ov-menu");
  $("btn-sync").onclick = openSync;
  $("m-memo").onclick = openImport;
  $("m-restore").onclick = () => $("file-in").click();
  $("m-json").onclick = exportJson;
  $("m-md").onclick = exportMd;
  $("m-sync").onclick = openSync;
  $("chips").addEventListener("wheel", (e) => { if (!e.deltaX && e.deltaY) { e.preventDefault(); $("chips").scrollLeft += e.deltaY; } }, { passive: false });

  // dock: hairline once stuck; column header sits right under it
  new IntersectionObserver(([en]) => $("dock").classList.toggle("stuck", !en.isIntersecting && en.boundingClientRect.top < 60), { rootMargin: "-1px 0px 0px 0px", threshold: 0 }).observe($("sentinel"));
  const syncDock = () => document.documentElement.style.setProperty("--dock-h", $("dock").offsetHeight + "px");
  new ResizeObserver(syncDock).observe($("dock")); syncDock();
  DESK.addEventListener("change", () => render());
  // add button steps aside while scrolling down
  let lastY = scrollY, ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => { const y = scrollY, d = y - lastY; $("hero").style.setProperty("--p", Math.min(1, Math.max(0, y / 110)).toFixed(3)); if (Math.abs(d) > 8) { $("fab").classList.toggle("away", d > 0 && y > 160); lastY = y; } ticking = false; });
  }, { passive: true });

  // ---------- start ----------
  initialPull = !Object.keys(store.books).length;
  render();
  sync();
})();
</script>
</body>
</html>
